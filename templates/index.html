<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="theme-color"
        id="theme-color"
        content="{% if state.is_on %}#3a3029{% else %}#15181c{% endif %}"
    >
    <title>豆電球</title>

    <!-- タブのアイコン。点灯・消灯のURLを data 属性に持たせ、JSから切り替える -->
    <link
        rel="icon"
        id="favicon"
        type="image/svg+xml"
        href="{{ url_for('static', filename='favicon-on.svg' if state.is_on else 'favicon-off.svg') }}"
        data-on="{{ url_for('static', filename='favicon-on.svg') }}"
        data-off="{{ url_for('static', filename='favicon-off.svg') }}"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="{% if state.is_on %}lights-on{% endif %}">

    <!-- 画面全体に広がる部屋の隅 -->
    <div class="scene">
        <div class="scene__left-wall" aria-hidden="true"></div>
        <div class="scene__right-wall" aria-hidden="true"></div>
        <div class="scene__floor" aria-hidden="true"></div>

        <div class="scene__wall-light" aria-hidden="true"></div>
        <div class="scene__floor-light" aria-hidden="true"></div>
        <div class="scene__shadow" aria-hidden="true"></div>

        <div
            class="bulb{% if state.is_on %} is-on{% endif %}"
            id="bulb"
            role="img"
            aria-label="{% if state.is_on %}点灯中{% else %}消灯中{% endif %}"
        >
            <span class="bulb__halo" aria-hidden="true"></span>
            <span class="bulb__glass" aria-hidden="true">
                <span class="bulb__filament"></span>
                <span class="bulb__shine"></span>
            </span>
            <span class="bulb__neck" aria-hidden="true"></span>
            <span class="bulb__base" aria-hidden="true"></span>
            <span class="bulb__contact" aria-hidden="true"></span>
            <span class="bulb__socket" aria-hidden="true"></span>
        </div>

        <div class="scene__vignette" aria-hidden="true"></div>
    </div>

    <!-- 文字・操作部分（部屋の上に重なる） -->
    <main class="page">
        <header class="heading">
            <p class="eyebrow">A LITTLE LIGHT IN THE CORNER</p>
            <h1>豆電球</h1>
        </header>

        <!-- ログイン状態（右上）。表示の切り替えは auth.js が行う -->
        <div class="auth" aria-label="ログイン">
            <span class="auth__user" id="user" hidden></span>
            <button class="auth__button" id="login" type="button" hidden>
                Googleでログイン
            </button>
            <button class="auth__button" id="logout" type="button" hidden>
                ログアウト
            </button>
            {% if not firebase_config %}
            <span class="auth__setup" role="status">
                Firebaseのログイン設定が必要です
            </span>
            {% endif %}
        </div>

        <section class="switchboard" aria-label="豆電球の操作">
            <div class="controls">
                <div class="readout">
                    <p class="readout__caption">LIGHT STATUS</p>
                    <p
                        class="status"
                        id="status"
                        aria-live="polite"
                        aria-label="{% if state.is_on %}ついています{% else %}消えています{% endif %}"
                    >{% if state.is_on %}ON{% else %}OFF{% endif %}</p>
                    <p class="counter">
                        押した回数 <span id="count">{{ state.press_count }}</span> 回
                    </p>
                </div>

                <button
                    class="toggle"
                    id="toggle"
                    type="button"
                    aria-pressed="{{ 'true' if state.is_on else 'false' }}"
                >
                    <span class="toggle__icon" aria-hidden="true"></span>
                    <span id="button-label">{% if state.is_on %}消す{% else %}つける{% endif %}</span>
                </button>
            </div>

            <p class="error" id="error" role="alert" hidden>
                保存できませんでした。少し待ってからもう一度押してください。
            </p>
        </section>
    </main>

    <!-- Firebase の設定が揃っているときだけ、ログイン機能を読み込む -->
    {% if firebase_config %}
    <script>
        window.FIREBASE_CONFIG = {{ firebase_config | tojson }};
    </script>
    <script type="module" src="{{ url_for('static', filename='auth.js') }}"></script>
    {% endif %}

    <script src="{{ url_for('static', filename='bulb.js') }}" defer></script>
</body>
</html>
