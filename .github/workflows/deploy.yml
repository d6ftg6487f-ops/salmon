name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: asia-northeast1
  SERVICE: applearning

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record tested revision
        run: git rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt

      - name: Typecheck and build browser scripts
        run: |
          npm run typecheck
          npm run build

      - name: Run existing Python tests without cloud services
        run: |
          env -u K_SERVICE -u CLOUD_SQL_CONNECTION_NAME -u GOOGLE_CLOUD_PROJECT \
            DATABASE_URL=sqlite:///:memory: \
            python -m unittest discover -s tests -v

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      # Listing the source upload needs no Google credentials or project.
      - name: Set up gcloud for source packaging inspection
        uses: google-github-actions/setup-gcloud@v2

      - name: Build clean Cloud Run source context
        run: |
          set -euo pipefail
          clean_source=$(mktemp -d)
          build_context=$(mktemp -d)
          git archive HEAD | tar -x -C "$clean_source"
          (
            cd "$clean_source"
            gcloud meta list-files-for-upload > "$RUNNER_TEMP/salmon-upload-files.txt"
            tar --verbatim-files-from -cf - -T "$RUNNER_TEMP/salmon-upload-files.txt" |
              tar -xf - -C "$build_context"
          )
          for input in Dockerfile requirements.txt app.py package.json package-lock.json tsconfig.json \
            src/bulb.ts src/chat.ts src/three-bulb.ts src/vendor/three.module.min.d.ts \
            templates/index.html static/styles.css static/favicon-on.svg static/favicon-off.svg \
            static/vendor/three.module.min.js static/vendor/three.core.min.js static/vendor/THREE-LICENSE.txt; do
            test -f "$build_context/$input"
          done
          for generated in static/bulb.js static/chat.js static/three-bulb.js node_modules; do
            test ! -e "$build_context/$generated"
          done
          docker build --no-cache --progress=plain -t salmon-ts:verify "$build_context"

      - name: Verify final container and browser behavior
        run: bash scripts/verify-container.sh salmon-ts:verify

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify active GCP identity
        run: |
          gcloud auth list
          gcloud config list project

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
          DB_DIALECT: ${{ vars.DB_DIALECT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VERTEX_AI_LOCATION: ${{ vars.VERTEX_AI_LOCATION }}
        run: |
          for key in GCP_PROJECT_ID GCP_SERVICE_ACCOUNT CLOUD_SQL_CONNECTION_NAME DB_DIALECT DB_USER DB_NAME; do
            if [[ -z "${!key}" ]]; then
              echo "::error::$key must be configured in GitHub Actions."
              exit 1
            fi
          done

          if [[ "$DB_DIALECT" != "postgres" && "$DB_DIALECT" != "mysql" ]]; then
            echo "::error::DB_DIALECT must be postgres or mysql."
            exit 1
          fi

          python -c 'import json, os; keys = ("CLOUD_SQL_CONNECTION_NAME", "DB_DIALECT", "DB_USER", "DB_NAME"); values = {key: os.environ[key] for key in keys}; values["GOOGLE_CLOUD_PROJECT"] = os.environ["GCP_PROJECT_ID"]; values["GEMINI_MODEL"] = os.environ.get("GEMINI_MODEL") or "gemini-3.1-flash-lite"; values["VERTEX_AI_LOCATION"] = os.environ.get("VERTEX_AI_LOCATION") or "global"; json.dump(values, open(os.path.join(os.environ["RUNNER_TEMP"], "cloud-run-env.json"), "w"))'

          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID" \
            --service-account "$GCP_SERVICE_ACCOUNT" \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --allow-unauthenticated \
            --add-cloudsql-instances "$CLOUD_SQL_CONNECTION_NAME" \
            --env-vars-file "$RUNNER_TEMP/cloud-run-env.json" \
            --set-secrets "DB_PASSWORD=applearning-db-password:latest"
